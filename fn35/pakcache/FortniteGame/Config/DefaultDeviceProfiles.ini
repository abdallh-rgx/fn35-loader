+CVars=slate.AbsoluteIndices=1
; Settings for GPU particles
+CVars=FX.AllowGPUParticles=1
; Max 256k partices
+CVars=fx.GPUSimulationTextureSizeX=512
+CVars=fx.GPUSimulationTextureSizeY=512
; Max 64k particles on low memory devices
+CVars_Smallest=fx.GPUSimulationTextureSizeX=256
+CVars_Tiniest=fx.GPUSimulationTextureSizeX=128
+CVars_Smallest=fx.GPUSimulationTextureSizeY=256
+CVars_Tiniest=fx.GPUSimulationTextureSizeY=128
+CVars=r.CustomDepth=0
+CVars=r.SupportReversedIndexBuffers=False
+CVars=r.SupportDepthOnlyIndexBuffers=False
+CVars=ai.NavCollisionAvailable=0
; On low memory devices we force grass off and discard data on load!
+CVars_Smallest=grass.densityScale=0
+CVars_Tiniest=grass.densityScale=0
+CVars_Smallest=grass.DiscardDataOnLoad=1
+CVars_Tiniest=grass.DiscardDataOnLoad=1
+CVars_Smallest=foliage.densityScale=0
+CVars_Tiniest=foliage.densityScale=0
+CVars_Smallest=foliage.DiscardDataOnLoad=1
+CVars_Tiniest=foliage.DiscardDataOnLoad=1
; Low quality materials are used on all mobile devices
+CVars=r.MaterialQualityLevel=0
;@todo: what does this do exactly?
+CVars=r.Streaming.UseFixedPoolSize=1
+CVars_Default=r.Streaming.PoolSize=500
+CVars_Smaller=r.Streaming.PoolSize=300
+CVars_Smallest=r.Streaming.PoolSize=180
+CVars_Tiniest=r.Streaming.PoolSize=16
+CVars_Smallest=r.Streaming.MaxTempMemoryAllowed=35
+CVars_Tiniest=r.Streaming.MaxTempMemoryAllowed=4
+CVars_Default=fort.skippreloadhack=0
+CVars_Smaller=fort.skippreloadhack=0
+CVars_Smallest=fort.skippreloadhack=0
+Cvars_Tiniest=fort.skippreloadhack=0
+CVars_Default=Fort.CosmeticManager.MaxHeroTypes=24
+CVars_Smaller=Fort.CosmeticManager.MaxHeroTypes=16
+CVars_Smallest=Fort.CosmeticManager.MaxHeroTypes=12
+CVars_Tiniest=Fort.CosmeticManager.MaxHeroTypes=6
; Don't preload the Frontend_C ui at startup as it won't be garbage collected ever, on low memory devices
+CVars_Default=fort.PreloadUIDataManager=0
+CVars_Smaller=fort.PreloadUIDataManager=0
+CVars_Smallest=fort.PreloadUIDataManager=0
+CVars_Tiniest=fort.PreloadUIDataManager=0
; Scalability Groups
+CVars=sg.ViewDistanceQuality=0
+CVars=sg.AntiAliasingQuality=0
+CVars=sg.ShadowQuality=0
+CVars=sg.PostProcessQuality=0
+CVars=sg.TextureQuality=0
+CVars=sg.EffectsQuality=0
+CVars=sg.FoliageQuality=0
; Dump shaders for non-active material qualities on load
+CVars=r.DiscardUnusedQuality=1
; Shader cache
+CVars=r.ShaderPipelineCache.Enabled=1
+CVars=r.ShaderPipelineCache.LogPSO=0
+CVars=r.ShaderPipelineCache.ReportPSO=1
; Disable LOD cross-fading
+CVars=lod.TemporalLag=0
; TODO: maybe move to scalability?
+CVars=r.SkeletalMeshLODBias=1
+CVars=r.SkeletalMeshLODRadiusScale=0.6
+CVars=foliage.MinLod=1
; Settings we want disabled globally / not set by scalability
+CVars=r.DetailMode=0
+CVars=r.CookOutUnusedDetailModeComponents=1
+CVars=r.PostProcessing.DisableMaterials=0
+CVars=r.DisableDistortion=1
+CVars=r.MaxAnisotropy=1
+CVars=r.BloomQuality=0
+CVars=r.LightShaftQuality=0
+CVars=grass.DisableDynamicShadows=1
+CVars=r.Tonemapper.Sharpen=0
+CVars=r.PostProcessAAQuality=0
+CVars=r.LightFunctionQuality=0
+CVars=r.SimpleForwardShading=0
+CVars=r.EyeAdaptationQuality=0
; Landscape distribution scale, same for all mobile devices
+CVars=r.LandscapeLOD0DistributionScale=1.0
+CVars=r.LandscapeLODDistributionScale=0.5
; Include medium level hlod
+CVars=Athena.CookOutMediumLevelHLODs=0

